# Laravel front controller: send all non-file requests to index.php
# Fixes 404 on /menu and other Laravel routes when no physical file exists.
# Used by Dockerfile; copied to /var/www/html/conf/nginx/nginx-site.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html/public;
    index index.php;

    # Laravel: try files/dirs first, then hand to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling (matches base image: unix socket)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    # Deny access to sensitive paths
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
